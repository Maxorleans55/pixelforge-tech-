<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PixelForge Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── DESIGN SYSTEM TOKENS (UI/UX Pro Max: Cyberpunk + AI-Native) ── */
:root{
  --bg:#080810;
  --bg2:#0c0c1a;
  --bg3:#10101f;
  --surface:#13132a;
  --surface2:#181830;
  --blue:#3b7bff;
  --blue-dim:#3b7bff22;
  --blue-mid:#3b7bff55;
  --purple:#9d5cff;
  --purple-dim:#9d5cff22;
  --cyan:#00d4ff;
  --cyan-dim:#00d4ff20;
  --pink:#ff3fa4;
  --pink-dim:#ff3fa422;
  --amber:#ffaa00;
  --green:#00e676;
  --text:#eef0fb;
  --text-muted:#7880a8;
  --text-faint:#464870;
  --border:#1a1a3a;
  --border-bright:#2a2a5a;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --radius-xl:22px;
  --transition:150ms cubic-bezier(.4,0,.2,1);
  --transition-md:250ms cubic-bezier(.4,0,.2,1);
}
.light{
  --bg:#f2f4ff;
  --bg2:#e8ecff;
  --bg3:#dde3ff;
  --surface:#ffffff;
  --surface2:#f5f7ff;
  --text:#0f1035;
  --text-muted:#4a4f80;
  --text-faint:#9098cc;
  --border:#d5daff;
  --border-bright:#b0baff;
}

/* ── RESET & BASE ── */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  line-height:1.6;
  overflow-x:hidden;
  transition:background var(--transition-md),color var(--transition-md);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{font-family:'Orbitron',monospace;letter-spacing:-.01em}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px}

/* ── SKIP LINK (accessibility) ── */
.skip-link{
  position:absolute;top:-60px;left:1rem;
  background:var(--blue);color:#fff;
  padding:.5rem 1rem;border-radius:var(--radius-md);
  font-weight:600;text-decoration:none;z-index:9999;
  transition:top var(--transition);
}
.skip-link:focus{top:1rem}

/* ── NAVBAR ── */
#navbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:.875rem 2rem;
  transition:all var(--transition-md);
}
#navbar.scrolled{
  background:rgba(8,8,16,.88);
  backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--border);
}
.light #navbar.scrolled{background:rgba(242,244,255,.88)}
.nav-left{display:flex;align-items:center;gap:.75rem}
.logo-wrap{
  position:relative;width:40px;height:40px;
  border-radius:50%;cursor:pointer;
  transition:transform var(--transition-md);
  flex-shrink:0;
}
.logo-wrap:hover{transform:rotate(-6deg) scale(1.08)}
.logo-ring{
  position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--blue),var(--purple),var(--cyan),var(--blue));
  animation:spin 4s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-inner{
  position:absolute;inset:2px;border-radius:50%;
  background:var(--bg3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',monospace;font-size:11px;font-weight:900;
  background-clip:text;-webkit-background-clip:text;
  overflow:hidden;
}
.logo-inner span{
  background:linear-gradient(135deg,var(--blue),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:900;
}
.brand{
  font-size:.82rem;font-weight:700;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.nav-right{display:flex;align-items:center;gap:1.25rem}
.nav-links{display:flex;gap:1rem;list-style:none}
.nav-links a{
  color:var(--text-muted);font-size:.78rem;text-decoration:none;
  padding:.3rem .5rem;border-radius:var(--radius-sm);
  transition:color var(--transition),background var(--transition);
  letter-spacing:.04em;
}
.nav-links a:hover,.nav-links a:focus{
  color:var(--cyan);background:var(--cyan-dim);
  outline:none;
}
.nav-links a:focus-visible{
  outline:2px solid var(--cyan);outline-offset:2px;
}
.theme-btn{
  background:none;border:1px solid var(--border-bright);
  border-radius:50%;width:38px;height:38px;
  cursor:pointer;font-size:1rem;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);
  min-width:44px;min-height:44px;
}
.theme-btn:hover{border-color:var(--blue);background:var(--blue-dim)}
.theme-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* hamburger */
.hamburger{
  display:none;flex-direction:column;gap:4px;
  background:none;border:none;cursor:pointer;padding:6px;
  min-width:44px;min-height:44px;align-items:center;justify-content:center;
}
.hamburger span{
  display:block;width:20px;height:2px;
  background:var(--text);border-radius:2px;
  transition:all var(--transition-md);
}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

.mobile-menu{
  display:none;
  position:fixed;top:64px;left:0;right:0;z-index:999;
  background:rgba(8,8,16,.96);
  backdrop-filter:blur(20px);
  padding:1.5rem 2rem;
  border-bottom:1px solid var(--border);
  flex-direction:column;gap:.5rem;
}
.mobile-menu.open{display:flex}
.mobile-menu a{
  color:var(--text-muted);font-size:.9rem;text-decoration:none;
  padding:.75rem 0;border-bottom:1px solid var(--border);
  transition:color var(--transition);
}
.mobile-menu a:hover{color:var(--cyan)}

/* ── HERO ── */
#hero{
  min-height:100svh;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;padding:5rem 2rem 4rem;
  text-align:center;
}
.hero-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,black 20%,transparent 100%);
  opacity:.35;
}
.hero-orb{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(100px);
}
.orb-1{width:500px;height:500px;background:var(--blue);opacity:.07;top:-150px;left:-100px}
.orb-2{width:400px;height:400px;background:var(--purple);opacity:.07;bottom:-100px;right:-80px}
.orb-3{width:300px;height:300px;background:var(--cyan);opacity:.05;top:50%;left:50%;transform:translate(-50%,-50%)}

.hero-inner{position:relative;z-index:2;max-width:760px;margin:0 auto}

.avatar-wrap{
  position:relative;width:130px;height:130px;margin:0 auto 2rem;
  animation:bob 5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pulse{
  position:absolute;border-radius:50%;
  border:1.5px solid var(--blue);
  animation:pulse 2.5s ease-out infinite;
}
.pulse:nth-child(1){inset:-12px;animation-delay:0s}
.pulse:nth-child(2){inset:-24px;opacity:.5;animation-delay:.6s}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.avatar-img{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:2px solid var(--blue-mid);
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;
  box-shadow:0 0 0 1px var(--border),0 0 40px var(--blue-dim);
}

.hero-badge{
  display:inline-block;padding:.3rem 1rem;border-radius:999px;
  background:var(--blue-dim);border:1px solid var(--blue-mid);
  color:var(--blue);font-size:.7rem;letter-spacing:.15em;
  margin-bottom:1.25rem;font-weight:600;text-transform:uppercase;
}
.hero-name{
  font-size:1.1rem;font-weight:600;margin-bottom:.75rem;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-title{
  font-size:clamp(2rem,5.5vw,4rem);font-weight:900;
  line-height:1.1;margin-bottom:1.25rem;
}
.hero-title .grad{
  background:linear-gradient(135deg,var(--blue),var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.typewriter{
  font-size:1.05rem;color:var(--cyan);margin-bottom:2rem;
  font-weight:300;letter-spacing:.04em;min-height:1.6rem;
}
.cursor{animation:blink .7s step-end infinite;color:var(--blue)}
@keyframes blink{50%{opacity:0}}
.hero-cta{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.875rem 2.25rem;border-radius:999px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-weight:700;font-size:.95rem;
  text-decoration:none;letter-spacing:.04em;
  transition:transform var(--transition),box-shadow var(--transition-md);
  position:relative;overflow:hidden;cursor:pointer;
  border:none;
}
.hero-cta::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);
  transform:translateX(-100%);transition:transform .5s;
}
.hero-cta:hover::before{transform:translateX(100%)}
.hero-cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 8px 32px var(--blue-mid)}
.hero-cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hero-cta svg{width:18px;height:18px;flex-shrink:0}

/* ── TICKER ── */
#ticker{
  overflow:hidden;
  padding:1rem 0;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  background:var(--bg2);
}
.ticker-track{
  display:flex;gap:2.5rem;width:max-content;
  animation:ticker 35s linear infinite;
}
.ticker-track:hover{animation-play-state:paused}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{
  display:flex;align-items:center;gap:.5rem;
  white-space:nowrap;font-size:.78rem;font-weight:500;
  color:var(--text-muted);letter-spacing:.04em;
}
.ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0}

/* ── SECTION BASE ── */
.section{padding:5rem 2rem;position:relative}
.section-inner{max-width:1100px;margin:0 auto}
.section-title{
  font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:900;
  text-align:center;margin-bottom:.75rem;
}
.section-sub{
  text-align:center;color:var(--text-muted);
  font-size:.95rem;margin-bottom:3rem;max-width:560px;margin-left:auto;margin-right:auto;
}
.grad-blue{
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.grad-purple{
  background:linear-gradient(90deg,var(--purple),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.grad-cyan{
  background:linear-gradient(90deg,var(--cyan),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.grad-green{
  background:linear-gradient(90deg,var(--green),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ── STATS ── */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1rem;
  max-width:900px;margin:0 auto;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.75rem 1.5rem;
  text-align:center;
  position:relative;overflow:hidden;
  transition:transform var(--transition-md),border-color var(--transition-md);
}
.stat-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  transition:opacity var(--transition-md);
}
.stat-card.blue::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.stat-card.purple::before{background:linear-gradient(90deg,var(--purple),var(--pink))}
.stat-card.cyan::before{background:linear-gradient(90deg,var(--cyan),var(--blue))}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.stat-card:hover{transform:translateY(-4px);border-color:var(--border-bright)}
.stat-num{
  font-family:'Orbitron',monospace;
  font-size:2.25rem;font-weight:900;
  line-height:1;margin-bottom:.5rem;
}
.stat-card.blue .stat-num{color:var(--blue)}
.stat-card.purple .stat-num{color:var(--purple)}
.stat-card.cyan .stat-num{color:var(--cyan)}
.stat-card.green .stat-num{color:var(--green)}
.stat-label{font-size:.78rem;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase}

/* ── TOPICS ── */
.topics-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1rem;
}
.topic-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:1.25rem 1.25rem;
  display:flex;align-items:center;gap:.875rem;
  transition:all var(--transition-md);
  cursor:default;
  opacity:0;transform:translateY(20px);
}
.topic-card.visible{opacity:1;transform:translateY(0)}
.topic-card:hover{
  border-color:var(--blue-mid);
  background:var(--surface2);
  transform:translateY(-2px);
}
.topic-icon{
  width:36px;height:36px;border-radius:var(--radius-sm);
  background:var(--blue-dim);border:1px solid var(--blue-mid);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:1rem;
}
.topic-name{font-size:.88rem;font-weight:500;line-height:1.3}

/* ── TOOLS ── */
.tools-tabs{
  display:flex;gap:.5rem;justify-content:center;
  flex-wrap:wrap;margin-bottom:2rem;
}
.tool-tab{
  padding:.6rem 1.25rem;border-radius:999px;
  border:1px solid var(--border);background:none;
  color:var(--text-muted);font-size:.82rem;font-weight:500;
  cursor:pointer;transition:all var(--transition);
  min-height:44px;letter-spacing:.03em;
}
.tool-tab:hover{border-color:var(--blue-mid);color:var(--text)}
.tool-tab.active{
  background:var(--blue);border-color:var(--blue);
  color:#fff;
}
.tool-tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tool-panel{display:none}
.tool-panel.active{display:block}
.tool-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:2rem;max-width:640px;margin:0 auto;
}

/* shared tool elements */
.tool-label{
  display:block;font-size:.78rem;color:var(--text-muted);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;font-weight:500;
}
.tool-input{
  width:100%;padding:.75rem 1rem;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-md);color:var(--text);
  font-size:.9rem;font-family:'Inter',sans-serif;
  transition:border-color var(--transition);
  margin-bottom:1rem;
}
.tool-input:focus{border-color:var(--blue-mid);outline:none}
.tool-output{
  width:100%;padding:.875rem 1rem;
  background:var(--bg);border:1px solid var(--border-bright);
  border-radius:var(--radius-md);color:var(--cyan);
  font-family:'Inter',monospace;font-size:.9rem;
  word-break:break-all;min-height:48px;line-height:1.6;
  resize:vertical;
}
.tool-row{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.tool-btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.65rem 1.25rem;border-radius:var(--radius-md);
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-weight:600;font-size:.85rem;
  border:none;cursor:pointer;
  transition:transform var(--transition),opacity var(--transition);
  min-height:44px;
}
.tool-btn:hover{transform:scale(1.02)}
.tool-btn:active{transform:scale(.98)}
.tool-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tool-btn.secondary{
  background:none;border:1px solid var(--border-bright);color:var(--text);
}
.tool-btn.secondary:hover{border-color:var(--blue-mid);background:var(--blue-dim)}

/* password specific */
.slider-wrap{margin-bottom:1rem}
.slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:4px;border-radius:2px;
  background:var(--border-bright);outline:none;cursor:pointer;
  transition:background var(--transition);
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:var(--blue);cursor:pointer;
  box-shadow:0 0 0 3px var(--blue-dim);
  transition:transform var(--transition);
}
.slider::-webkit-slider-thumb:hover{transform:scale(1.15)}
.slider:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.slider-val{
  display:flex;justify-content:space-between;
  font-size:.78rem;color:var(--text-muted);margin-top:.4rem;
}
.toggle-group{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.toggle-pill{
  padding:.4rem .875rem;border-radius:999px;
  border:1px solid var(--border-bright);background:none;
  color:var(--text-muted);font-size:.78rem;cursor:pointer;
  transition:all var(--transition);min-height:36px;
}
.toggle-pill.on{
  background:var(--blue-dim);border-color:var(--blue-mid);color:var(--blue);
}
.toggle-pill:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.strength-bar{
  height:4px;border-radius:2px;margin-top:.75rem;
  background:var(--border-bright);overflow:hidden;
}
.strength-fill{
  height:100%;border-radius:2px;width:0%;
  transition:width .4s ease,background .4s ease;
}

/* color palette specific */
.palette-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-bottom:1rem;
}
.swatch{
  aspect-ratio:1;border-radius:var(--radius-sm);
  cursor:pointer;border:2px solid transparent;
  transition:transform var(--transition),border-color var(--transition);
  position:relative;
}
.swatch:hover{transform:scale(1.08)}
.swatch:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.swatch-hex{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.6);color:#fff;font-size:.6rem;
  text-align:center;padding:.15rem;border-radius:0 0 4px 4px;
  opacity:0;transition:opacity var(--transition);font-family:monospace;
}
.swatch:hover .swatch-hex{opacity:1}
.copy-toast{
  display:none;position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);
  background:var(--surface);border:1px solid var(--border-bright);
  color:var(--green);padding:.6rem 1.25rem;border-radius:var(--radius-md);
  font-size:.85rem;font-weight:500;z-index:9999;
  animation:fadeup .2s ease;
}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── ANIME SECTION ── */
#anime-section{
  padding:5rem 2rem;
  background:var(--bg2);
  position:relative;overflow:hidden;
}
.anime-chars-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:1.5rem;
  max-width:1000px;margin:0 auto;
}
.anime-char-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.5rem 1rem;
  text-align:center;
  transition:all var(--transition-md);
  cursor:default;
}
.anime-char-card:hover{
  transform:translateY(-6px);
  border-color:var(--border-bright);
}
.char-avatar{
  width:80px;height:80px;margin:0 auto 1rem;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--border-bright);
  font-size:2.5rem;
  position:relative;
  animation:float 4s ease-in-out infinite;
}
.char-avatar::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid;
  opacity:.3;
